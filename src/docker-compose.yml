services:
  mysql:
    image: mysql:8.4
    container_name: meta_lab_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: meta_lab
      MYSQL_USER: meta
      MYSQL_PASSWORD: meta_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3366:3366"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: meta_lab_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://root:root_password@mysql:3366/meta_lab
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
